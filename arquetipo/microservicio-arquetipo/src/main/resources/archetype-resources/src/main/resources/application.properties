#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
spring.application.name=microservicio
server.port=8080

${symbol_pound} Conexion a Oracle Autonomous Database.
${symbol_pound} La clave de ADMIN va en la variable de entorno ORACLE_PASSWORD.
spring.datasource.url=jdbc:oracle:thin:@${symbol_dollar}{ORACLE_TNS_ALIAS:biblio_low}?TNS_ADMIN=${symbol_dollar}{ORACLE_TNS_ADMIN:C:/oracle/wallet/Wallet_biblio}
spring.datasource.username=${symbol_dollar}{ORACLE_USER:ADMIN}
spring.datasource.password=${symbol_dollar}{ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
