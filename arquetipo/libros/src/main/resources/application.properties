spring.application.name=libros
server.port=8080

# Conexion a Oracle Autonomous Database.
# La clave de ADMIN va en la variable de entorno ORACLE_PASSWORD.
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:biblio_low}?TNS_ADMIN=${ORACLE_TNS_ADMIN:C:/oracle/wallet/Wallet_biblio}
spring.datasource.username=${ORACLE_USER:ADMIN}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
