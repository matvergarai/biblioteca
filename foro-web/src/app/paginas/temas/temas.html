<section>
  <div class="row g-3 align-items-end">
    <div class="col-12 col-lg-8">
      <p class="nexo-kicker">Busqueda</p>
      <h1>Temas del foro</h1>
    </div>
    <div class="col-12 col-lg-4 text-lg-end">
      <a class="btn nexo-btn" routerLink="/publicar">Publicar tema</a>
    </div>
  </div>
  <form class="row g-3 nexo-filtros" [formGroup]="form">
    <div class="col-12 col-md-7">
      <label class="form-label" for="texto">Texto</label>
      <input class="form-control" id="texto" formControlName="texto" placeholder="Buscar en titulo o contenido" />
    </div>
    <div class="col-12 col-md-5">
      <label class="form-label" for="categoriaId">Categoria</label>
      <select class="form-select" id="categoriaId" formControlName="categoriaId">
        <option value="">Todas</option>
        @for (categoria of foro.categorias(); track categoria.id) {
          <option [value]="categoria.id">{{ categoria.nombre }}</option>
        }
      </select>
    </div>
  </form>
  <div class="row g-3">
    @for (tema of resultados(); track tema.id) {
      <div class="col-12 col-lg-6">
        <a class="nexo-tarjeta" [routerLink]="['/temas', tema.id]">
          <small>{{ nombreCategoria(tema.categoriaId) }}</small>
          <strong>{{ tema.titulo }}</strong>
          <span>{{ tema.contenido }}</span>
          <small>{{ nombreAutor(tema.autorId) }}</small>
        </a>
      </div>
    } @empty {
      <div class="col-12"><p>No hay temas publicados con ese filtro.</p></div>
    }
  </div>
</section>
